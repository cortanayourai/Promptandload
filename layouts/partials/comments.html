{{- /* giscus comments — post pages only (any content/ section);
       never on root pages (about/contact/privacy).
       Kill-switch per post: `comments: false` in front matter. */ -}}
{{- if and .Section (ne .Params.comments false) -}}
<div class="giscus"></div>
<script src="https://giscus.app/client.js"
        data-repo="cortanayourai/Promptandload"
        data-repo-id="R_kgDOVNz0Lw"
        data-category="General"
        data-mapping="pathname"
        data-strict="0"
        data-reactions-enabled="1"
        data-emit-metadata="0"
        data-input-position="bottom"
        data-theme="dark"
        data-lang="en"
        data-loading="lazy"
        crossorigin="anonymous"
        async></script>
{{- end -}}
